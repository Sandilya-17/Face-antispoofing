name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # tensorflow-cpu is only needed for the GAN extension scripts, not
          # for the feature-extraction unit tests, so it's skipped here to
          # keep CI fast.
          pip install numpy opencv-python-headless scikit-learn scikit-image matplotlib joblib pytest ruff

      - name: Lint (ruff)
        run: ruff check src/ tests/ --line-length=100 || true

      - name: Run dataset-free unit tests
        run: pytest tests/ -v
